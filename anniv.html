<!DOCTYPE html>
<html>
<head>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Merriweather&family=Poppins:wght@600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      opacity: 0;
      transition: opacity 1s ease;
    }
    body.fade-in { opacity: 1; }

    .hero {
      position: relative;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      color: white;
      text-align: center;
      overflow: hidden;
      padding-top: 220px;
    }
    .hero::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: url('pics.jpg') no-repeat center center/cover;
      filter: blur(6px);
      transform: scale(1.1);
      z-index: -1;
    }

    /* Navbar */
    .navbar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 8px;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1000;
    }

    /* Logo */
    .navbar .logo {
      margin-left: 40px; 
    }
    .navbar .logo img {
      height: 100px; 
      cursor: pointer;
      display: block;
    }

    .navbar .links {
      display: flex;
      justify-content: center;
      flex: 1;
    }

    /* Button style for links */
    .navbar .links a {
      font-family: 'Poppins', sans-serif;
      color: white;
      text-align: center;
      padding: 10px 20px;
      text-decoration: none;
      border: 1px solid white;
      border-radius: 5px;
      margin: 0 10px;
      transition: 0.3s;
    }
    .navbar .links a:hover {
      background-color: rgba(255, 255, 255, 0.2);
      color: #5a9cf2;
      border-color: #4895fa;
      box-shadow: 0 0 10px rgba(72, 149, 250, 0.7);
    }

    .hero h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 110px;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.6);
    }
    .hero p {
      font-family: 'Merriweather', serif;
      font-size: 20px;
      margin-top: -10px;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.6);
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .navbar .logo img {
        height: 60px;
      }
      .hero h1 {
        font-size: 60px;
      }
      .hero p {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="hero">
    <!-- Navbar -->
    <div class="navbar">
      <!-- Logo -->
      <div class="logo">
        <a href="#" onclick="parent.goHome()">
          <img src="logo.png" alt="Logo">
        </a>
      </div>

      <!-- Links -->
      <div class="links">
        <a href="journey.html">Our Journey</a>
        <a href="notes.html">Love Notes</a>
        <a href="gallery.html">Photo Memories</a>
      </div>
    </div>

    <!-- Heading and Subtext -->
    <h1>Our Anniversary Page</h1>
    <p>Every memory we share is a treasure forever.</p>
  </div>

  <script>
    // Fade-in effect
    window.addEventListener("load", () => {
      document.body.classList.add("fade-in");
    });
  </script>
</body>
</html>
