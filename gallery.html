<!DOCTYPE html>
<html>
<head>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Merriweather&family=Poppins:wght@600&display=swap" rel="stylesheet">
  <style>
    body { margin:0; opacity:0; transition:opacity 1s ease; }
    body.fade-in { opacity:1; }

    .hero {
      position:relative; min-height:100vh; display:flex; flex-direction:column;
      align-items:center; color:white; text-align:center; overflow:hidden; padding-top:120px;
    }
    .hero::before {
      content:""; position:absolute; top:0; left:0; width:100%; height:100%;
      background:url('up.jpg') no-repeat center center/cover;
      filter:blur(6px); transform:scale(1.1); z-index:-1;
    }
	
	.hero::after {
	content:"";
	position:absolute;
	inset:0;
	background:rgba(0,0,0,0.45);
	z-index:-1;
	}

    .navbar {
      width:100%; display:flex; align-items:center; justify-content:space-between;
      background:rgba(0,0,0,0.6); padding:8px; position:fixed; top:0; left:0; z-index:1000;
    }
    .navbar .logo img { height:80px; cursor:pointer; }
    .navbar .links { display:flex; flex:1; justify-content:center; }
    .navbar .links a {
      font-family:'Poppins',sans-serif; color:white; padding:10px 20px;
      text-decoration:none; border:1px solid white; border-radius:5px; margin:0 10px;
      transition:0.3s;
    }
    .navbar .links a:hover {
      background-color:rgba(255,255,255,0.2); color:#5a9cf2; border-color:#4895fa;
      box-shadow:0 0 10px rgba(72,149,250,0.7);
    }

    h1 { font-family:'Great Vibes',cursive; font-size:80px; text-shadow:2px 2px 6px rgba(0,0,0,0.6); }
    .gallery {
      display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:20px; padding:40px; width:100%;
    }

    .hero p {
      font-family: 'Merriweather', serif;
      font-size: 16px;
      margin-top: -40px;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.6);
    }
    .gallery img {
	width:100%;
	border-radius:15px;
	box-shadow:0 10px 25px rgba(0,0,0,0.35);
	transition:0.3s;
	}

    .gallery img:hover {
	transform:scale(1.03) translateY(-5px);
	box-shadow:0 15px 35px rgba(0,0,0,0.45);
	}

    /* Back button style */
    .back-btn {
      display:inline-block; margin-top:30px;
      font-family:'Poppins',sans-serif;
      border:1px solid white; color:white;
      padding:8px 16px; border-radius:5px;
      text-decoration:none; transition:0.3s;
    }
    .back-btn:hover {
      background-color:rgba(255,255,255,0.2);
      color:#5a9cf2; border-color:#4895fa;
      box-shadow:0 0 10px rgba(72,149,250,0.7);
    }
	
	.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.85);
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.modal-box {
  text-align: center;
  color: white;
  max-width: 800px;
  padding: 20px;
}

.modal-content {
  max-width: 80%;
  max-height: 70vh;
  border-radius: 10px;
}

.modal-desc {
  margin-top: 20px;
  font-family: 'Merriweather', serif;
  font-size: 18px;
  line-height: 1.8;
  background: rgba(255,255,255,0.08);
  padding: 20px;
  border-radius: 15px;
}

.close {
  position: absolute;
  top: 20px;
  right: 30px;
  font-size: 35px;
  cursor: pointer;
  color: white;
}
  </style>
</head>
<body>
  <div class="hero">
    <div class="navbar">
      <div class="logo">
        <a href="#" onclick="parent.goHome()"><img src="logo.png" alt="Logo"></a>
      </div>
      <div class="links">
        <a href="journey.html">Our Journey</a>
        <a href="notes.html">Letter for you</a>
        <a href="gallery.html">Photo Memories</a>
      </div>
    </div>

    <h1>Photo Memories</h1>
	<p>Every picture holds a memory I will always cherish with you.</p>
    <div class="gallery">
      <img src="hearts.jpg" alt="Memory 1"
	onclick="openModal('hearts.jpg','Our first Valentine’s date together. I still remember how excited I was to finally spend this special day with you. The flowers were simple, but seeing your smile made that moment unforgettable. It was one of those memories that reminded me how lucky I am to have you.')">
      <img src="picnic.jpg" alt="Memory 2"
	onclick="openModal('picnic.jpg','Our original plan was to visit Eco Park, but things did not go exactly as expected. Instead, we ended up at Wildlife and somehow made the day just as fun. Moments like these taught me that it is not really about the destination, it is about being with you.')">
      <img src="cinee.jpg" alt="Memory 3"
	onclick="openModal('cinee.jpg','A movie date because you really wanted to see Catriona Gray on the big screen. Watching you enjoy the film was honestly more entertaining than the movie itself. Every little date with you becomes a memory I always end up cherishing.')">
      <img src="us.jpg" alt="Memory 4"
	onclick="openModal('us.jpg','Happy birthday to my love! Not only we were celebrating your special day, but we also finally had our Oscars date together. Seeing you happy that day was more than enough to make the entire celebration special for me.')">
      <img src="moa.jpg" alt="Memory 5"
	onclick="openModal('moa.jpg','The day I tried Thai food for the first time with you. I was excited, nervous, and curious all at once, but sharing the experience with you made it even better. It became another one of those simple memories that turned into something unforgettable.')">
      <img src="jogg.jpg" alt="Memory 6"
	onclick="openModal('jogg.jpg','A simple jogging date that somehow became one of our funniest memories. From getting tired after a few rounds to enjoying sweet corn together afterward, it was one of those days where even the smallest moments felt special because I was with you.')">
      <img src="laguna.jpg" alt="Memory 7"
	onclick="openModal('laguna.jpg','One of our adventures where we somehow ended up riding with friends just so we could travel farther together. Looking back, it still makes me smile. One day, we will make even bigger trips together, hopefully in a vehicle we can proudly call our own.')">
      <img src="bdayy.jpg" alt="Memory 8"
	onclick="openModal('bdayy.jpg','Another birthday celebration for my pancake, this time surrounded by family. It made me happy seeing you enjoy your special day with the people you love most. Being included in moments like these always makes me feel closer to you. What made it even more special was that we were also celebrating our monthsary that day, giving us another reason to be grateful and happy together. It was a day filled with love, laughter, and memories that I will always treasure.')">
	  <img src="bday.jpg" alt="Memory 9"
	onclick="openModal('bday.jpg','My birthday and one of the most unforgettable surprises of my life. Honestly, it was the first time I had ever been genuinely surprised on my birthday. You made me feel loved, appreciated, and special in a way I will never forget.')">
	  <img src="swimming.jpg" alt="Memory 10"
	onclick="openModal('swimming.jpg','My first time joining one of your family outings. I was nervous at first, but I ended up having such a wonderful time. What made me happiest was feeling welcomed and being able to create memories not just with you, but with the people closest to your heart.')">
	  <img src="marilaq.jpg" alt="Memory 11"
	onclick="openModal('marilaq.jpg','Our first long ride together, all because you wanted to enjoy beautiful views and spend time surrounded by nature. The road was long, but every kilometer felt worth it because I got to experience it all with you.')">
	  <img src="igorot.jpg" alt="Memory 12"
	onclick="openModal('igorot.jpg','Our double date in Baguio with Ate Manel and Kuya Bry. The cool weather, the beautiful scenery, and the laughter we shared made this trip one to remember. It was another reminder of how much I enjoy experiencing new places with you.')">
	  <img src="buffet.jpg" alt="Memory 13"
	onclick="openModal('buffet.jpg','Being invited to Ate Jen’s birthday celebration was special, but what made it even better was spending more time with your family. Moments like these always make me feel grateful because they remind me that I am becoming part of your world.')">
	  <img src="binondo.jpg" alt="Memory 14"
	onclick="openModal('binondo.jpg','A Binondo food trip because we were both craving good food and a fun date together. From walking through busy streets to trying different dishes, every moment became another happy memory. Somehow food always tastes better when I am sharing it with you.')">
    </div>

    <!-- Back Button nasa baba ng gallery -->
    <a href="anniv.html" class="back-btn">⬅ Back to Anniversary</a>
  </div>
<div id="photoModal" class="modal">
  <span class="close" onclick="closeModal()">&times;</span>

  <div class="modal-box">
    <img id="modalImg" class="modal-content">
    <div id="modalDesc" class="modal-desc"></div>
  </div>
</div>


<script>
  window.addEventListener("load", () => {
    document.body.classList.add("fade-in");
  });

  function openModal(image, description) {
    document.getElementById("photoModal").style.display = "flex";
    document.getElementById("modalImg").src = image;
    document.getElementById("modalDesc").innerText = description;
  }

  function closeModal() {
    document.getElementById("photoModal").style.display = "none";
  }
</script>
</body>
</html>
