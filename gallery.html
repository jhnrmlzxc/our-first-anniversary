<!DOCTYPE html>
<html>
<head>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Merriweather&family=Poppins:wght@600&display=swap" rel="stylesheet">
  <style>
    body { margin:0; opacity:0; transition:opacity 1s ease; }
    body.fade-in { opacity:1; }

    .hero {
      position:relative; min-height:100vh; display:flex; flex-direction:column;
      align-items:center; color:white; text-align:center; overflow:hidden; padding-top:120px;
    }
    .hero::before {
      content:""; position:absolute; top:0; left:0; width:100%; height:100%;
      background:url('motor.png') no-repeat center center/cover;
      filter:blur(6px); transform:scale(1.1); z-index:-1;
    }

    .navbar {
      width:100%; display:flex; align-items:center; justify-content:space-between;
      background:rgba(0,0,0,0.6); padding:8px; position:fixed; top:0; left:0; z-index:1000;
    }
    .navbar .logo img { height:80px; cursor:pointer; }
    .navbar .links { display:flex; flex:1; justify-content:center; }
    .navbar .links a {
      font-family:'Poppins',sans-serif; color:white; padding:10px 20px;
      text-decoration:none; border:1px solid white; border-radius:5px; margin:0 10px;
      transition:0.3s;
    }
    .navbar .links a:hover {
      background-color:rgba(255,255,255,0.2); color:#5a9cf2; border-color:#4895fa;
      box-shadow:0 0 10px rgba(72,149,250,0.7);
    }

    h1 { font-family:'Great Vibes',cursive; font-size:80px; text-shadow:2px 2px 6px rgba(0,0,0,0.6); }
    .gallery {
      display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:20px; padding:40px; width:100%;
    }
    .hero p {
      font-family: 'Merriweather', serif;
      font-size: 16px;
      margin-top: -40px;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.6);
    }
    .gallery img {
      width:100%; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.5);
      transition:transform 0.3s;
    }
    .gallery img:hover { transform:scale(1.05); }

    /* Back button style */
    .back-btn {
      display:inline-block; margin-top:30px;
      font-family:'Poppins',sans-serif;
      border:1px solid white; color:white;
      padding:8px 16px; border-radius:5px;
      text-decoration:none; transition:0.3s;
    }
    .back-btn:hover {
      background-color:rgba(255,255,255,0.2);
      color:#5a9cf2; border-color:#4895fa;
      box-shadow:0 0 10px rgba(72,149,250,0.7);
    }
	
	.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.85);
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.modal-box {
  text-align: center;
  color: white;
  max-width: 800px;
  padding: 20px;
}

.modal-content {
  max-width: 80%;
  max-height: 70vh;
  border-radius: 10px;
}

.modal-desc {
  margin-top: 15px;
  font-family: 'Merriweather', serif;
  font-size: 18px;
}

.close {
  position: absolute;
  top: 20px;
  right: 30px;
  font-size: 35px;
  cursor: pointer;
  color: white;
}
  </style>
</head>
<body>
  <div class="hero">
    <div class="navbar">
      <div class="logo">
        <a href="#" onclick="parent.goHome()"><img src="logo.png" alt="Logo"></a>
      </div>
      <div class="links">
        <a href="journey.html">Our Journey</a>
        <a href="notes.html">Love Notes</a>
        <a href="gallery.html">Photo Memories</a>
      </div>
    </div>

    <h1>Photo Memories</h1>
	<p>These moments remind me how blessed I am with you.</p>
    <div class="gallery">
      <img src="hearts.jpg" alt="Memory 1"
	onclick="openModal('hearts.jpg','Our first valentines date hehe flowers for u lablab')">
      <img src="picnic.jpg" alt="Memory 2"
	onclick="openModal('picnic.jpg','Hindi natuloy sa eco park kaya nag wild life na lang hahahah')">
      <img src="cinee.jpg" alt="Memory 3"
	onclick="openModal('cinee.jpg','Cine kasi gusto mo mapanood si catriona gray')">
      <img src="ramen.jpg" alt="Memory 4"
	onclick="openModal('ramen.jpg','Walang mahanap na kainan paikot ikot sa fairview terraces ayan nag ramen na lang')">
      <img src="moa.jpg" alt="Memory 5"
	onclick="openModal('moa.jpg','First try ko ng thai food w youu')">
      <img src="jogg.jpg" alt="Memory 6"
	onclick="openModal('jogg.jpg','Jogging tapos sweet corn moments hahaha')">
      <img src="laguna.jpg" alt="Memory 7"
	onclick="openModal('laguna.jpg','Nakisabit pa tayo sa iba makalayo lang hahah soon sariling sasakyan na natin')">
      <img src="siken.jpg" alt="Memory 8"
	onclick="openModal('siken.jpg','Unli wings dapat to e kaso ang daming tao. cravings ko ata to that day')">
	  <img src="ramenn.jpg" alt="Memory 9"
	onclick="openModal('ramenn.jpg','Ito cravings ko na naman heheh nilibre mo ko nito eh kasi sabi mo good boy ako hahahaha')">
	  <img src="swimming.jpg" alt="Memory 10"
	onclick="openModal('swimming.jpg','First time ko makasama sa family outing nyo super happy ang coco')">
	  <img src="marilaq.jpg" alt="Memory 11"
	onclick="openModal('marilaq.jpg','Unang long ride natin bago makilala ng buong maquiling fam')">
	  <img src="theat.jpg" alt="Memory 12"
	onclick="openModal('theat.jpg','First time ko manood sa show nila ate manel w your fam hehehe')">
	  <img src="buffet.jpg" alt="Memory 13"
	onclick="openModal('buffet.jpg','Invited sa bday celeb ni ate jen happy again kasi kasama fam mo')">
	  <img src="medi.jpg" alt="Memory 14"
	onclick="openModal('medi.jpg','Pa check up tapos nagpa rest n go massage')">
    </div>

    <!-- Back Button nasa baba ng gallery -->
    <a href="anniv.html" class="back-btn">⬅ Back to Anniversary</a>
  </div>
<div id="photoModal" class="modal">
  <span class="close" onclick="closeModal()">&times;</span>

  <div class="modal-box">
    <img id="modalImg" class="modal-content">
    <div id="modalDesc" class="modal-desc"></div>
  </div>
</div>


<script>
  window.addEventListener("load", () => {
    document.body.classList.add("fade-in");
  });

  function openModal(image, description) {
    document.getElementById("photoModal").style.display = "flex";
    document.getElementById("modalImg").src = image;
    document.getElementById("modalDesc").innerText = description;
  }

  function closeModal() {
    document.getElementById("photoModal").style.display = "none";
  }
</script>
</body>
</html>
